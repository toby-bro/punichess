<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161512" />
    <link rel="icon" href="/favicon.png" />
    <title>Punichess</title>
  </head>
  <body>
    <main>
      <div class="board-row">
        <div id="board"></div>
        <div id="eval-bar" hidden>
          <div id="eval-fill"></div>
          <span id="eval-text"></span>
        </div>
      </div>

      <p id="status">Loading…</p>

      <div class="controls">
        <button id="first" type="button" title="Start (Home)" aria-label="Go to start">⏮</button>
        <button id="back" type="button" title="Back (←)" aria-label="Previous move">◀</button>
        <button id="forward" type="button" title="Forward (→)" aria-label="Next move">▶</button>
        <button id="last" type="button" title="Latest (End)" aria-label="Go to latest">⏭</button>
        <span class="spacer"></span>
        <button id="reveal" type="button" hidden>Show me</button>
        <button
          id="punish"
          type="button"
          hidden
          title="Play it, and let the bot punish it properly"
        >
          Punish me
        </button>
        <button id="ignore" type="button" hidden title="Play it anyway and carry on">Ignore</button>
        <button id="resume" type="button" hidden>Back to game</button>
        <button id="fork" type="button" hidden>Play from here</button>
        <button id="another" type="button" hidden title="Ask for a different move in this position">
          Another move
        </button>
      </div>

      <div id="moves" class="moves" aria-label="Moves played"></div>

      <div class="bar">
        <span id="score">spotted 0 · missed 0</span>
        <span id="acpl"></span>
      </div>

      <div class="controls">
        <button id="swap" type="button" title="Take over the other side, keeping this position">
          Swap sides
        </button>
        <button id="review-run" type="button">Review game</button>
        <label
          class="switch"
          id="evaluate-box"
          hidden
          title="Evaluate positions the review has not already seen"
        >
          <input id="evaluate" type="checkbox" />
          <span class="track"></span>
          Evaluate new positions
        </label>
        <button id="new-game" type="button">New game</button>
      </div>

      <details id="settings-box">
        <summary>Bot settings</summary>
        <div id="settings"></div>
        <div class="controls">
          <button
            id="forget"
            type="button"
            title="Discard the record of positions you have blundered in"
          >
            Forget my mistakes
          </button>
        </div>
      </details>

      <details id="pgn-box">
        <summary>PGN</summary>
        <div class="controls">
          <button id="pgn-export" type="button">Export</button>
          <button id="pgn-import" type="button">Import</button>
          <button id="pgn-copy" type="button">Copy</button>
          <label class="file-button">
            Open file
            <input id="pgn-file" type="file" accept=".pgn,text/plain" />
          </label>
        </div>
        <textarea
          id="pgn-text"
          rows="6"
          spellcheck="false"
          placeholder="Export writes the game here. Paste a PGN and press Import to replay it."
        ></textarea>
        <p id="pgn-status" class="pgn-status"></p>
      </details>

      <section id="review" hidden aria-label="Game review"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
