<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161512" />
    <meta
      name="description"
      content="A chess bot that blunders on purpose and stops you the moment you fail to
      punish it. Runs entirely on your phone, offline, with Stockfish in a web worker."
    />
    <link rel="canonical" href="https://punichess.toby.re/" />
    <!-- The svg is what browsers that can use it should use: one file, sharp at
         every size, no background, and the knight follows the browser's theme.
         The png is for the ones that cannot, and keeps its background, since a
         file that cannot adapt is safer with a ground of its own. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- What a shared link looks like. Worth more than any amount of sitemap
         for a site that is one page and has almost no text to index. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Punichess" />
    <meta property="og:title" content="Punichess" />
    <meta
      property="og:description"
      content="A chess bot that blunders on purpose and stops you the moment you fail to
      punish it. Offline, on your phone."
    />
    <meta property="og:url" content="https://punichess.toby.re/" />
    <meta property="og:image" content="https://punichess.toby.re/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- The one thing on the page that comes over the network. Which face is
         asked for is decided per load, in src/brand.ts; these only open the
         connection early so it is ready when it is. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Punichess</title>
  </head>
  <body>
    <main>
      <div class="stage">
        <div class="top">
          <!-- The face is picked per load. Which one it was is written into the
               markup as a comment right here, so it is there when you want it
               and on the page never. -->
          <div class="title-row">
            <h1 class="brand">Punichess</h1>
            <!-- GitHub's own mark, used unmodified to link back to GitHub,
                 which is what their logo guidelines are for. -->
            <a
              class="repo"
              href="https://github.com/toby-bro/punichess"
              target="_blank"
              rel="noopener noreferrer"
              title="Source on GitHub"
              aria-label="Source on GitHub"
            >
              <!-- width and height as attributes, not only in the stylesheet.
                   An inline svg with nothing but a viewBox has no intrinsic size,
                   so until the stylesheet arrives the browser falls back to its
                   default 300x150 and the cat appears enormous for a frame. -->
              <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                />
              </svg>
            </a>
          </div>

          <!-- The toggle and the arrows share the line above the evaluation
               bar. The name has the line to itself. -->
          <div class="header">
            <label
              class="switch stamp"
              id="punish-box"
              title="The bot answers with best moves only, from here down this branch"
            >
              <input id="punish-toggle" type="checkbox" />
              <span class="track"></span>
              <span class="switch-label">Punishing</span>
            </label>
            <div class="nav">
              <button id="first" type="button" title="Start (Home)" aria-label="Go to start">
                ⏮
              </button>
              <button id="back" type="button" title="Back (←)" aria-label="Previous move">◀</button>
              <button id="forward" type="button" title="Forward (→)" aria-label="Next move">
                ▶
              </button>
              <button id="last" type="button" title="Latest (End)" aria-label="Go to latest">
                ⏭
              </button>
            </div>
          </div>

          <!-- Always in the layout, even during a game when it says nothing:
               a bar that appears and disappears resizes the board under you. -->
          <div id="eval-bar" aria-hidden="true">
            <div id="eval-fill"></div>
            <span id="eval-text"></span>
          </div>
        </div>

        <!-- What each side has taken, and by how much one is ahead. Above the
             board belongs to whoever is playing from the far side. -->
        <div id="taken-top" class="taken cg-wrap" aria-hidden="true"></div>

        <div class="board-row">
          <div class="board-holder">
            <div id="board"></div>
            <!-- Over the pawn, as pieces. Inside a cg-wrap so the board's own
                 piece images apply to it. -->
            <div id="promotion" class="cg-wrap promotion" hidden>
              <div id="promotion-veil" class="promotion-veil"></div>
              <div id="promotion-choices" class="promotion-choices">
                <button type="button" class="promotion-choice" data-role="q" aria-label="Queen">
                  <piece class="queen"></piece>
                </button>
                <button type="button" class="promotion-choice" data-role="r" aria-label="Rook">
                  <piece class="rook"></piece>
                </button>
                <button type="button" class="promotion-choice" data-role="b" aria-label="Bishop">
                  <piece class="bishop"></piece>
                </button>
                <button type="button" class="promotion-choice" data-role="n" aria-label="Knight">
                  <piece class="knight"></piece>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="taken-bottom" class="taken cg-wrap" aria-hidden="true"></div>

        <div class="under">
          <p id="status">Loading…</p>
          <!-- The answers to whatever the status line just said. Always in the
               layout, empty or not: it is below the board, and a row that
               appears pushes the board off centre exactly when you are being
               asked to look at it. -->
          <div class="controls actions">
            <button id="reveal" type="button" hidden>Show me</button>
            <button
              id="punish"
              type="button"
              hidden
              title="Play it, and let the bot punish it properly"
            >
              Punish me
            </button>
            <button id="ignore" type="button" hidden title="Play it anyway and carry on">
              Ignore
            </button>
            <button
              id="another"
              type="button"
              hidden
              title="Ask for a different move in this position"
            >
              Another move
            </button>
          </div>
        </div>
      </div>

      <div id="moves" class="moves" aria-label="Moves played"></div>
      <div class="controls moves-controls">
        <button id="expand-moves" type="button" aria-expanded="false">Show more</button>
        <span class="spacer"></span>
        <button id="swap" type="button" title="Take over the other side, keeping this position">
          Swap sides
        </button>
        <!-- Cycles white, black, switch. Decides what the next game deals you;
             swap sides changes the one you are in. -->
        <button
          id="play-as"
          type="button"
          title="Which colour a new game gives you. Click to cycle."
        >
          White
        </button>
        <button id="new-game" type="button">New game</button>
        <label
          class="switch"
          id="keep-box"
          title="Save the game in progress when starting a new one"
        >
          <input id="keep" type="checkbox" />
          <span class="track"></span>
          <span class="switch-label">Save on new</span>
        </label>
      </div>

      <div class="bar">
        <span id="score">spotted 0 · missed 0 · made 0</span>
        <span id="acpl"></span>
        <span class="spacer"></span>
        <button id="review-run" type="button">Review game</button>
        <label
          class="switch"
          id="evaluate-box"
          hidden
          title="Evaluate positions the review has not already seen"
        >
          <input id="evaluate" type="checkbox" />
          <span class="track"></span>
          <span class="switch-label">Evaluate new positions</span>
        </label>
      </div>

      <details id="settings-box">
        <summary>Bot settings</summary>
        <div id="settings"></div>
        <div class="controls">
          <button
            id="forget"
            type="button"
            title="Discard what this game remembers about where you went wrong"
          >
            Forget this game's mistakes
          </button>
        </div>
      </details>

      <details id="games-box">
        <summary>Saved games</summary>
        <div class="controls">
          <button id="save-game" type="button">Save this game</button>
          <button
            id="clear-analysis"
            type="button"
            title="Give back the space the stored engine analysis takes, keeping the games"
          >
            Clear stored analysis
          </button>
        </div>
        <div id="games"></div>
      </details>

      <details id="appearance-box">
        <summary>Board and pieces</summary>
        <div id="appearance"></div>
      </details>

      <details id="pgn-box">
        <summary>PGN</summary>
        <div class="controls">
          <button id="pgn-export" type="button">Export</button>
          <button id="pgn-import" type="button">Import</button>
          <button id="pgn-copy" type="button">Copy</button>
          <label class="file-button">
            Open file
            <input id="pgn-file" type="file" accept=".pgn,text/plain" />
          </label>
        </div>
        <textarea
          id="pgn-text"
          rows="6"
          spellcheck="false"
          placeholder="Export writes the game here. Paste a PGN and press Import to replay it."
        ></textarea>
        <p id="pgn-status" class="pgn-status"></p>
      </details>

      <section id="review" hidden aria-label="Game review"></section>

      <!-- Fixed rather than in the flow: an update notice that pushed the board
           would be a worse interruption than the one it is announcing, and one
           further down the page would never be seen. -->
      <button id="update" class="update-toast" type="button" hidden>
        New version — tap to reload
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
