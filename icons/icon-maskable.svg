<!-- Punichess, maskable.
     Fills 88% of the canvas, which is most of the way to the plain icon's 89%.
     The maskable safe zone would have it at 72% and the splash screen would have
     it at 60%, and both of those leave the knight adrift in a field of background
     on the splash screen and in the recents view, which is what an icon sized by
     the rules rather than by how it looks actually does. The pool's ends are the
     only thing a circular mask takes, and a pool that runs past the edge of the
     frame is not a defect. -->
