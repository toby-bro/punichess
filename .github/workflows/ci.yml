name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only what a build needs. Without this the job runs with whatever the
# repository hands out by default, which can include write access it has no use
# for -- and a build is exactly where an unwanted dependency gets to run code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile is where the Node version lives, because it is the one
      # Dependabot actually updates: it manages the base image, and it does not
      # touch `node-version` here -- that is an input to an action, not an action
      # version, so it would have sat on 24 while the container walked on to 26
      # and beyond. Reading it keeps one number instead of two that agree by
      # someone remembering.
      - id: node
        run: sed -n 's/^FROM node:\([0-9][0-9]*\).*/version=\1/p' Dockerfile >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      # Install scripts are refused: no package in the tree runs code on install.
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
