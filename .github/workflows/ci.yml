name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only what a build needs. Without this the job runs with whatever the
# repository hands out by default, which can include write access it has no use
# for -- and a build is exactly where an unwanted dependency gets to run code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Install scripts are refused: no package in the tree runs code on install.
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
