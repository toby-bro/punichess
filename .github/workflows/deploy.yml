name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # BASE must match the site's path. A custom domain serves from the root,
      # so leave BASE_PATH unset; set it to "/<repo>/" only for a project page
      # on github.io.
      #
      # The custom domain itself lives in public/CNAME rather than in the repo
      # settings alone: an Actions deploy publishes an artifact instead of a
      # branch, so a CNAME file that is not in the build is not in the site, and
      # GitHub drops the domain on the next deploy.
      - run: npm run build
        env:
          BASE: ${{ vars.BASE_PATH || '/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
