name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile is where the Node version lives, because it is the one
      # Dependabot actually updates: it manages the base image, and it does not
      # touch `node-version` here -- that is an input to an action, not an action
      # version, so it would have sat on 24 while the container walked on to 26
      # and beyond. Reading it keeps one number instead of two that agree by
      # someone remembering.
      - id: node
        run: sed -n 's/^FROM node:\([0-9][0-9]*\).*/version=\1/p' Dockerfile >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci --ignore-scripts
      # BASE must match the site's path. A custom domain serves from the root,
      # so leave BASE_PATH unset; set it to "/<repo>/" only for a project page
      # on github.io.
      - run: npm run build
        env:
          BASE: ${{ vars.BASE_PATH || '/' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
