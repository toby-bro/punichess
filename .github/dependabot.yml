# Weekly dependency updates.
#
# Three ecosystems, because this repo has three sets of pinned versions and all
# of them go stale quietly: the npm tree, the workflow actions, and the Docker
# base image.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps arrive as one pull request a week rather than a
    # dozen. Majors stay separate: those are the ones worth reading.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

    # No `ignore:` here, on purpose.
    #
    # TypeScript 7 is the Go rewrite and typescript-eslint declares
    # `peer typescript: >=4.8.4 <6.1.0`, so npm refuses the combination and the
    # weekly pull request cannot install. It was ignored for a while to stop that
    # reopening; it is not any more.
    #
    # An ignore rule is unconditional. It does not lapse when the upstream peer
    # range opens, so the bump would simply never be offered again and nothing
    # would say why -- a workaround for somebody else's constraint, kept in this
    # repository, outliving the constraint. The failing pull request is the
    # better signal: it is not ours to fix, it says so every week, and it will
    # start passing by itself on the day typescript-eslint allows 7.

  # The actions were all a major or two behind before anyone noticed, which is
  # exactly the kind of drift nobody goes looking for.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # node:24-slim, which moves underneath us as patches land.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
